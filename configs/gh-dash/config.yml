prSections:
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 50
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings: {}
repoPaths: {}
pager:
    diff: ""
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true

theme:
    ui:
        sectionsShowCount: true
    table:
        showSeparators: true
        compact: false
    colors:
        text:
            primary: "#dadada"
            secondary: "#67b0e8"
            inverted: "#303030"
            faint: "#dadada"
            warning: "#800000"
            success: "#008000"
    background:
        selected: "#67b0e8"
    border:
        primary: "#67b0e8"
        secondary: "#67b0e8"
        faint: "#dadada"
    icons:
        inline:
            newcontributor: "󰎔"
            contributor: ""
            collaborator: ""
            member: ""
            owner: ""
            unknownrole: "󰭙"